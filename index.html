<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>miRKatAI — Under Construction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0b0e1a 0%, #1a1040 50%, #0b0e1a 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 640px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2rem;
      padding: 4rem 3rem;
      backdrop-filter: blur(8px);
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #a0a0b8;
      margin-bottom: 0.75rem;
    }
    .badge {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 999px;
      font-size: 0.85rem;
      color: #a78bfa;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>miRKatAI</h1>
    <p>We're working on major changes to make<br>miRNA research faster, smarter, and more accessible.</p>
    <p>Our next generation of tools is being built<br>to better serve the research community.</p>
    <div class="badge">Under construction — coming soon</div>
  </div>
</body>
</html>
